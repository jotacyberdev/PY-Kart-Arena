<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIXHINHO RUSH — Seleção</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="selection-body">
  <main class="selection">
    <header class="simple-top"><div class="brand"><span>🐾</span><strong>BIXHINHO <b>RUSH</b></strong></div><span>SIMULAÇÃO</span></header>
    <section class="selection-content">
      <div>
        <span class="eyebrow">ANTES DA LARGADA</span>
        <h1>Escolha seu<br>bixhinho.</h1>
        <p>Você controla um piloto. Os outros três entram como CPU.</p>
      </div>
      <div class="character-stage">
        <div class="character-art" id="selectedArt">🐯</div>
        <div class="character-name" id="selectedName">Tigrinho</div>
        <div class="character-line">Sem atributos. Só sorte.</div>
      </div>
      <div class="character-grid" id="characterGrid"></div>
      <button class="primary" id="chooseButton">ESCOLHER PERSONAGEM</button>
    </section>
  </main>
  <script src="/js/selection.js"></script>
</body>
</html>
